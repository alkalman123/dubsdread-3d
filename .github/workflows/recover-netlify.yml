name: Recover golf build from Netlify (one-off)

on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/recover-netlify.yml']

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every file the deployed site is made of
        run: |
          set -u
          BASE=https://gleeful-pastelito-916303.netlify.app
          mkdir -p recovered/js recovered/poc
          for f in index.html hole1.html flat.html check.html preview.html README.txt _headers \
                   course-data.js branding.js \
                   js/math.js js/gl.js js/shaders.js js/field.js js/terrain.js js/foliage.js js/shot.js js/app.js js/ui.js \
                   poc/sky-model.js poc/foliage-poc.js poc/shaders-poc.js poc/render-poc.js poc/shot-poc.js \
                   poc/play.js poc/ui-poc.js poc/flat.js poc/soft3d.js poc/README.md; do
            if curl -sSfL "$BASE/$f" -o "recovered/$f"; then echo "ok   $f $(wc -c < recovered/$f)"; else echo "MISS $f"; rm -f "recovered/$f"; fi
          done
          for f in recovered/*.js recovered/js/*.js recovered/poc/*.js; do node --check "$f" || echo "BADJS $f"; done
      - name: Commit them back to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add recovered
          git commit -m "Recover the deployed golf build from Netlify"
          git push
