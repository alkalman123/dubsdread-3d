name: Fetch CC0 textures and skies, part 2 (temporary)
on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/fetch-assets.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: asset-staging, path: stage }
      - name: Download
        working-directory: stage
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) dubsdread-asset-fetch'
          mkdir -p ph hdri atlas
          for id in LeafSet016 LeafSet024 LeafSet010 LeafSet009 LeafSet005 LeafSet014 LeafSet022 LeafSet023 LeafSet027 PineNeedles001 Foliage008 Foliage001; do
            curl -sfL -A "$UA" "https://ambientcg.com/get?file=${id}_2K-PNG.zip" -o "atlas/$id.zip" || echo "::warning::fail atlas $id"
          done
          ph() { # id kind
            curl -sfL -A "$UA" "https://api.polyhaven.com/files/$1" -o /tmp/f.json || { echo "::warning::fail api $1"; return; }
            if [ "$2" = hdri ]; then
              u=$(python3 -c "import json;print(json.load(open('/tmp/f.json'))['hdri']['2k']['hdr']['url'])")
              curl -sfL -A "$UA" "$u" -o "hdri/$1_2k.hdr" || echo "::warning::fail hdr $1"
            else
              for m in Diffuse nor_gl Rough; do
                u=$(python3 -c "import json,sys;f=json.load(open('/tmp/f.json'));print(f['$m']['2k']['jpg']['url'] if '$m' in f else '')")
                [ -n "$u" ] && curl -sfL -A "$UA" "$u" -o "ph/$1_$m.jpg"
              done
            fi
          }
          for t in sand_01 sand_02 sand_03 forest_leaves_02 forrest_ground_01 forest_floor asphalt_02 clean_asphalt bark_brown_02 jolcham_oak_bark_01 leafy_grass sparse_grass; do ph $t tex; done
          for h in kloofendal_48d_partly_cloudy_puresky kloofendal_43d_clear_puresky belfast_sunset_puresky kloppenheim_06_puresky; do ph $h hdri; done
          du -sh ph hdri atlas; ls -la ph hdri atlas
      - name: Push
        working-directory: stage
        run: |
          git config user.name asset-fetch
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -qm "More raw CC0 downloads: leaf atlases, Poly Haven textures, skies"
          git push origin HEAD:asset-staging
