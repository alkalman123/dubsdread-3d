name: Build courses from OSM + USGS 3DEP (temporary)
on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/build-courses.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/golf-hole-poc-realistic-0lfn8x }
      - run: pip install numpy tifffile pillow imagecodecs
      - name: Build
        run: |
          set -o pipefail
          python3 -u tools/build_any_course.py 2>&1 | tee build.log
          grep -E "^==|wrote|failed|found|terrain" build.log | sed 's/^/::notice::/'
      - name: Thumbnails
        run: |
          for f in golf/courses/*.js; do case "$f" in *index.js|*cog-hill-4.js) ;; *) python3 tools/course_thumb.py "$f";; esac; done
      - name: Commit
        run: |
          git config user.name course-builder; git config user.email actions@users.noreply.github.com
          cp build.log tools/last-build.log
          git add golf/courses tools/last-build.log
          git commit -m "Courses built from OpenStreetMap and USGS 3DEP" || exit 0
          git pull --rebase origin claude/golf-hole-poc-realistic-0lfn8x
          git push
