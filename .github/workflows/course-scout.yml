name: Scout OSM golf courses, take 2 (temporary)
on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/course-scout.yml']
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/golf-hole-poc-realistic-0lfn8x }
      - run: python3 -u tools/course_scout.py
      - run: |
          mkdir -p tools/scout && mv course-scout.json tools/scout/
          git config user.name course-scout; git config user.email actions@users.noreply.github.com
          git add tools/scout && git commit -m "Course scout results (temporary)" && git push
