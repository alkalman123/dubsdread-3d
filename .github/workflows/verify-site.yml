name: Verify live golf site (temporary)
on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/verify-site.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://alkalman123.github.io/dubsdread-3d
          sleep 15
          for p in "" poc/assets-poc.js poc/audio-poc.js assets/assets.json assets/ground-color.jpg assets/ground-normal.jpg assets/leaves.png assets/sky-day.jpg assets/sky-evening.jpg assets/bark.jpg flat.html; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' "$B/$p")
            echo "::notice::$code $p $(wc -c </tmp/o) bytes"
          done
