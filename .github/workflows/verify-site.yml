name: Verify live golf site (temporary)
on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/verify-site.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://alkalman123.github.io/dubsdread-3d
          for p in "" "?hole=2&tee=0" poc/soft3d.js poc/flat.js manifest.json apple-touch-icon.png flat.html webgl.html crux-shop/; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' "$B/$p")
            echo "::notice::$code $B/$p $(wc -c </tmp/o) bytes"
          done
          curl -s "$B/" | grep -o '<title>[^<]*' | sed 's/^/::notice::title /'
          curl -s "$B/poc/soft3d.js" | grep -c 'function tri' | sed 's/^/::notice::new renderer present: /'
