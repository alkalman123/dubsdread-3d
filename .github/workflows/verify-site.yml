name: Verify live golf site (temporary)
on:
  push:
    branches: [claude/golf-hole-poc-realistic-0lfn8x]
    paths: ['.github/workflows/verify-site.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://alkalman123.github.io/dubsdread-3d
          sleep 20
          for p in "" "?hole=2&tee=0" poc/phone-poc.js poc/render-poc.js js/field.js flat.html webgl.html manifest.json crux-shop/; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' "$B/$p")
            echo "::notice::$code $p $(wc -c </tmp/o) bytes"
          done
          curl -s "$B/" | grep -c 'phone-poc.js' | sed 's/^/::notice::phone layout wired in: /'
