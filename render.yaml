# Render Blueprint — deploys garmin-viewer/ and crux-shop/ as separate
# services from this one repo. In the Render dashboard: New + -> Blueprint
# -> pick this repo -> Apply. Docs: https://render.com/docs/blueprint-spec
#
# The crux-shop entry below is a best-effort static-site blueprint — this
# session's network egress to render.com was blocked, so its exact syntax
# (`runtime: static` vs an older `env: static`) could not be verified
# against Render's current docs before writing it. If "Apply" rejects it,
# skip the blueprint for that service and use the manual path instead:
# Render dashboard -> New + -> Static Site -> connect this repo -> set
# Root Directory to crux-shop, Build Command to blank/echo, Publish
# Directory to "." — see business/RENDER-DEPLOYMENT.md for full steps.
services:
  - type: web
    name: alpine-log-garmin-viewer
    runtime: node
    rootDir: garmin-viewer
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Your own Garmin Connect login. Set these in the Render dashboard
      # (not here) so the value never touches the repo. Leaving them unset
      # is fine — the app runs in demo mode until they're filled in.
      - key: GARMIN_USERNAME
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      # Optional: phrases briefings with Claude instead of the built-in
      # template. Leave unset to use the free template.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SYNC_CRON
        value: "0 */2 * * *"

  # Crux — the climbing-gear storefront. Static site, no build step.
  - type: web
    name: crux-shop
    runtime: static
    rootDir: crux-shop
    buildCommand: "true"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
