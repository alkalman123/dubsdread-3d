# Render Blueprint — deploys garmin-viewer/ as a standalone web service.
# In the Render dashboard: New + -> Blueprint -> pick this repo -> Apply.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: alpine-log-garmin-viewer
    runtime: node
    rootDir: garmin-viewer
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Your own Garmin Connect login. Set these in the Render dashboard
      # (not here) so the value never touches the repo. Leaving them unset
      # is fine — the app runs in demo mode until they're filled in.
      - key: GARMIN_USERNAME
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      # Optional: phrases briefings with Claude instead of the built-in
      # template. Leave unset to use the free template.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SYNC_CRON
        value: "0 */2 * * *"
      # Point these at the alpine-log-garmin-backend service below (its URL,
      # and the same BACKEND_API_TOKEN you set on it) to get real live
      # Garmin data instead of GARMIN_USERNAME/PASSWORD -- Garmin's login
      # is Cloudflare-blocked from Render, which is why that separate
      # service exists (it authenticates via a one-time local login
      # instead). Leaving these unset keeps the old direct-login path.
      - key: PYTHON_BACKEND_URL
        sync: false
      - key: PYTHON_BACKEND_TOKEN
        sync: false

  - type: web
    name: alpine-log-garmin-backend
    runtime: python
    rootDir: garmin-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      # Pin to a stable Python version. Render's own default tracks the
      # newest release (currently 3.14), which is too new for some of our
      # dependencies (pydantic-core in particular) to have prebuilt
      # packages for yet -- pip then tries to compile it from source with
      # Rust/maturin, which fails in Render's build sandbox (read-only
      # filesystem for the cargo cache). 3.12 has prebuilt packages for
      # everything in requirements.txt.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Secret you make up yourself (e.g. `openssl rand -hex 32`) that the
      # mobile app / frontend must send as "Authorization: Bearer <this>".
      - key: BACKEND_API_TOKEN
        sync: false
      # Output of `python cli_login.py`, run once from your own PC. See
      # garmin-backend/README.md.
      - key: GARMIN_TOKENSTORE_JSON
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      # How far back a full backfill reaches. 120 covers a few months of
      # margin past however long you've actually owned the watch --
      # pulling further back than your device's own history just means
      # hundreds of extra all-empty days that still cost API calls and
      # backfill time for nothing.
      - key: BACKFILL_DAYS
        value: "120"
