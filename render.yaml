# Render Blueprint — deploys garmin-viewer/ as a standalone web service.
# In the Render dashboard: New + -> Blueprint -> pick this repo -> Apply.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: alpine-log-garmin-viewer
    runtime: node
    rootDir: garmin-viewer
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Your own Garmin Connect login. Set these in the Render dashboard
      # (not here) so the value never touches the repo. Leaving them unset
      # is fine — the app runs in demo mode until they're filled in.
      - key: GARMIN_USERNAME
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      # Optional: phrases briefings with Claude instead of the built-in
      # template. Leave unset to use the free template.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SYNC_CRON
        value: "0 */2 * * *"

  - type: web
    name: alpine-log-garmin-backend
    runtime: python
    rootDir: garmin-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      # Secret you make up yourself (e.g. `openssl rand -hex 32`) that the
      # mobile app / frontend must send as "Authorization: Bearer <this>".
      - key: BACKEND_API_TOKEN
        sync: false
      # Output of `python cli_login.py`, run once from your own PC. See
      # garmin-backend/README.md.
      - key: GARMIN_TOKENSTORE_JSON
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: BACKFILL_DAYS
        value: "365"
