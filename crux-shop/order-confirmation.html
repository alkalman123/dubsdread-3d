<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="mark"><svg viewBox="0 0 20 22" fill="none"><path d="M2 20.5V10C2 5 5.6 1.5 10 1.5S18 5 18 10v10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="5.5" y="8.6" width="9" height="3.1" rx="1.55" fill="currentColor"/><rect x="5.5" y="13.6" width="9" height="3.1" rx="1.55" fill="currentColor"/></svg></span>
      CRUX
    </a>
    <nav class="nav-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="btn-icon" id="menuToggle" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="btn-icon" data-cart-open aria-label="Open cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="icon-badge" data-cart-count style="display:none;">0</span>
      </button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav" aria-hidden="true">
  <div class="backdrop"></div>
  <div class="panel">
    <div class="panel-top">
      <span class="logo"><span class="mark"><svg viewBox="0 0 20 22" fill="none"><path d="M2 20.5V10C2 5 5.6 1.5 10 1.5S18 5 18 10v10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="5.5" y="8.6" width="9" height="3.1" rx="1.55" fill="currentColor"/><rect x="5.5" y="13.6" width="9" height="3.1" rx="1.55" fill="currentColor"/></svg></span>CRUX</span>
      <button class="btn-icon" id="mobileNavClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="shipping-returns.html">Shipping &amp; Returns</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<div class="cart-drawer-root" id="cartDrawerRoot" aria-hidden="true">
  <div class="backdrop"></div>
  <div class="cart-drawer">
    <div class="cart-drawer-head">
      <h3>Your cart</h3>
      <button class="btn-icon" id="cartDrawerClose" aria-label="Close cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cart-drawer-items" id="cartDrawerItems"></div>
    <div class="cart-drawer-foot" id="cartDrawerFoot" style="display:none;">
      <div class="cart-subtotal-row"><span>Subtotal</span><span class="num" id="cartDrawerSubtotal">$0.00</span></div>
      <div class="cart-ship-note" id="cartShipNote"></div>
      <a href="checkout.html" class="btn btn-primary btn-block">Checkout</a>
      <a href="cart.html" class="btn btn-ghost btn-block" style="justify-content:center;margin-top:10px;">View full cart</a>
    </div>
  </div>
</div>

<main id="main">
<div id="confirmRoot" class="confirm-wrap">
  <!-- filled by script -->
</div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:0;margin-top:0;padding-top:0;">
      <span>© <span data-year></span> Crux Supply Co. Not affiliated with any climbing-gear manufacturer or safety-equipment standard.</span>
      <div class="legal-links">
        <a href="shipping-returns.html">Returns</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </div>
</footer>

<script src="js/store-data.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = params.get('order');
  const order = id ? getOrder(id) : null;
  const root = document.getElementById('confirmRoot');

  if (!order) {
    root.innerHTML = `
      <h1 style="font-size:1.8rem;">We couldn't find that order</h1>
      <p class="lede" style="margin-top:14px;">The order link looks incomplete, or this browser's storage was cleared since you placed it. If you just checked out, check your email for a copy — otherwise get in touch and we'll sort it out.</p>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap;">
        <a href="shop.html" class="btn btn-primary">Back to shop</a>
        <a href="contact.html" class="btn btn-outline">Contact us</a>
      </div>`;
    return;
  }

  const itemsHtml = order.items.map((it) => `
    <div class="summary-line" style="align-items:flex-start;">
      <span>${escapeHtml(it.name)}${it.variant ? ` <span class="muted">· ${escapeHtml(it.variant)}</span>` : ''} <span class="muted">×${it.qty}</span></span>
      <b class="num">${fmtMoney(it.price * it.qty)}</b>
    </div>`).join('');

  const addr = order.customer || {};
  const addrLines = [addr.fullName, addr.address1, addr.address2, [addr.city, addr.state, addr.zip].filter(Boolean).join(', '), addr.country].filter(Boolean);

  root.innerHTML = `
    <div class="confirm-check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 style="font-size:1.9rem;">Order received</h1>
    <p class="lede" style="margin-top:10px;">Thanks — we've got it. A confirmation is on its way to ${escapeHtml(addr.email || 'your inbox')}.</p>
    <div class="order-id-pill">Order ${escapeHtml(order.id)}</div>

    <div class="order-summary-card" style="text-align:left;margin-top:36px;">
      <h3 style="margin-bottom:16px;">What you ordered</h3>
      ${itemsHtml}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">
        <div class="summary-line"><span>Subtotal</span><b class="num">${fmtMoney(order.subtotal)}</b></div>
        ${order.discount > 0 ? `<div class="summary-line"><span>Discount</span><b class="num">−${fmtMoney(order.discount)}</b></div>` : ''}
        <div class="summary-line"><span>Shipping (${escapeHtml(order.shippingMethod)})</span><b class="num">${order.shippingCost === 0 ? 'Free' : fmtMoney(order.shippingCost)}</b></div>
        <div class="summary-line total"><span>Total</span><b class="num">${fmtMoney(order.total)}</b></div>
      </div>
      ${addrLines.length ? `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.7;"><b style="color:var(--ink);">Shipping to</b><br>${addrLines.map(escapeHtml).join('<br>')}</div>` : ''}
    </div>

    <ol class="confirm-steps">
      <li><span class="num-badge">1</span><span class="txt"><b>We confirm &amp; invoice</b><span>Usually within one business day, by email, with a secure link to pay.</span></span></li>
      <li><span class="num-badge">2</span><span class="txt"><b>It goes on the plate</b><span>Printed to order, 2–4 business days.</span></span></li>
      <li><span class="num-badge">3</span><span class="txt"><b>It ships</b><span>Tracking sent to your email the moment it's boxed.</span></span></li>
    </ol>

    <div style="display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap;">
      <a href="#" id="emailOrderBtn" class="btn btn-outline">Email us this order</a>
      <a href="shop.html" class="btn btn-primary">Continue shopping</a>
    </div>
  `;

  const emailBtn = document.getElementById('emailOrderBtn');
  if (emailBtn) {
    emailBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const lines = [
        `Order ${order.id}`,
        '',
        ...order.items.map((it) => `- ${it.name}${it.variant ? ' (' + it.variant + ')' : ''} x${it.qty} — ${fmtMoney(it.price * it.qty)}`),
        '',
        `Total: ${fmtMoney(order.total)} (shipping: ${order.shippingMethod})`,
        '',
        'Ship to:',
        ...addrLines,
        addr.phone ? `Phone: ${addr.phone}` : '',
        addr.orderNotes ? `Notes: ${addr.orderNotes}` : '',
      ].filter(Boolean);
      const body = encodeURIComponent(lines.join('\n'));
      const subject = encodeURIComponent(`Crux order ${order.id}`);
      window.location.href = `mailto:${SHOP.email}?subject=${subject}&body=${body}`;
    });
  }
})();
</script>
</body>
</html>
