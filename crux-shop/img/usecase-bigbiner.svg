<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the Big Biner hanging from a garage hook, loaded with trad cams, quickdraws and a helmet">
  <rect width="800" height="560" rx="20" fill="#efeadf"/>

  <!-- wall panel lines -->
  <line x1="60" y1="60" x2="60" y2="500" stroke="#15191c" stroke-opacity=".10" stroke-width="3"/>
  <line x1="260" y1="60" x2="260" y2="500" stroke="#15191c" stroke-opacity=".10" stroke-width="3"/>
  <line x1="460" y1="60" x2="460" y2="500" stroke="#15191c" stroke-opacity=".10" stroke-width="3"/>
  <line x1="660" y1="60" x2="660" y2="500" stroke="#15191c" stroke-opacity=".10" stroke-width="3"/>

  <!-- hook -->
  <g transform="translate(400,100)">
    <rect x="-7" y="-30" width="14" height="26" rx="4" fill="#15191c"/>
    <path d="M-7 -6 C -24 -6 -24 22 0 22 C 18 22 18 4 6 2" fill="none" stroke="#15191c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Big Biner frame: rounded D shape with a ring of holes -->
  <g transform="translate(400,320)">
    <path d="M0 -195
             C 120 -195 205 -110 205 5
             C 205 120 120 180 0 180
             C -120 180 -205 120 -205 5
             C -205 -110 -120 -195 0 -195 Z"
          fill="none" stroke="#15191c" stroke-width="30" stroke-linejoin="round"/>
    <!-- top mount hole -->
    <circle cx="0" cy="-195" r="15" fill="#efeadf" stroke="#15191c" stroke-width="5"/>
    <!-- ring of hanging holes along the bottom arc -->
    <g fill="#efeadf" stroke="#15191c" stroke-width="5">
      <circle cx="-178" cy="-55" r="15"/>
      <circle cx="-202" cy="15" r="15"/>
      <circle cx="-190" cy="85" r="15"/>
      <circle cx="-150" cy="140" r="15"/>
      <circle cx="-90" cy="172" r="15"/>
      <circle cx="-20" cy="184" r="15"/>
      <circle cx="50" cy="178" r="15"/>
      <circle cx="115" cy="152" r="15"/>
      <circle cx="165" cy="105" r="15"/>
      <circle cx="195" cy="40" r="15"/>
      <circle cx="198" cy="-35" r="15"/>
      <circle cx="170" cy="-100" r="15"/>
      <circle cx="115" cy="-155" r="15"/>
      <circle cx="55" cy="-183" r="15"/>
    </g>
  </g>

  <!-- gear: cams hung through a few holes -->
  <g stroke="#15191c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- cam 1 -->
    <g transform="translate(222,268)">
      <line x1="0" y1="-8" x2="0" y2="46" stroke-width="6"/>
      <circle cx="0" cy="-8" r="9" fill="#efeadf"/>
      <path d="M-4 46 L4 46 L2 70 L-2 70 Z" fill="#d85c2a"/>
      <g fill="#d85c2a" opacity=".9">
        <ellipse cx="-16" cy="10" rx="13" ry="20" transform="rotate(-25 -16 10)"/>
        <ellipse cx="15" cy="10" rx="13" ry="20" transform="rotate(25 15 10)"/>
      </g>
    </g>
    <!-- cam 2 -->
    <g transform="translate(600,270)">
      <line x1="0" y1="-8" x2="0" y2="46" stroke-width="6"/>
      <circle cx="0" cy="-8" r="9" fill="#efeadf"/>
      <path d="M-4 46 L4 46 L2 70 L-2 70 Z" fill="#4a90c2"/>
      <g fill="#4a90c2" opacity=".9">
        <ellipse cx="-16" cy="10" rx="13" ry="20" transform="rotate(-25 -16 10)"/>
        <ellipse cx="15" cy="10" rx="13" ry="20" transform="rotate(25 15 10)"/>
      </g>
    </g>
  </g>

  <!-- helmet hung through a wide hole -->
  <g transform="translate(415,505)">
    <path d="M-50 6 C -50 -34 -26 -56 0 -56 C 26 -56 50 -34 50 6 Z" fill="#d85c2a" stroke="#15191c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-52 6 H52" stroke="#15191c" stroke-width="5" stroke-linecap="round"/>
    <path d="M-30 6 v14 M30 6 v14" stroke="#15191c" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
