<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rackhouse sticker pack: carabiner mark, wordmark, mountain icon and a NOT FOR CLIMBING novelty sticker">
  <rect width="800" height="560" rx="20" fill="#efeadf"/>

  <!-- circle mark sticker -->
  <g transform="translate(210,190) rotate(-8)">
    <circle cx="0" cy="0" r="88" fill="#ffffff" stroke="#15191c" stroke-width="4"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#15191c" stroke-opacity=".12" stroke-width="10"/>
    <circle cx="0" cy="6" r="48" fill="none" stroke="#20232a" stroke-width="9"/>
    <line x1="-35" y1="-16" x2="8" y2="-16" stroke="#d85c2a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-35" cy="-16" r="5" fill="#d85c2a"/>
    <circle cx="8" cy="-16" r="5" fill="#d85c2a"/>
  </g>

  <!-- wordmark rectangle sticker -->
  <g transform="translate(560,150) rotate(6)">
    <rect x="-140" y="-46" width="280" height="92" rx="14" fill="#20232a" stroke="#15191c" stroke-width="4"/>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="4" fill="#f7f4ee">RACKHOUSE</text>
  </g>

  <!-- mountain icon sticker -->
  <g transform="translate(230,400) rotate(4)">
    <rect x="-95" y="-70" width="190" height="140" rx="20" fill="#4a90c2" fill-opacity=".18" stroke="#15191c" stroke-width="4"/>
    <path d="M-55 30 L-15 -30 L15 5 L35 -20 L60 30 Z" fill="#20232a"/>
    <circle cx="30" cy="-42" r="10" fill="#d85c2a"/>
  </g>

  <!-- NOT FOR CLIMBING novelty tag sticker -->
  <g transform="translate(560,395) rotate(-5)">
    <rect x="-135" y="-42" width="270" height="84" rx="42" fill="#d85c2a" stroke="#15191c" stroke-width="4"/>
    <text x="0" y="9" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#f7f4ee">NOT FOR CLIMBING</text>
  </g>
</svg>
