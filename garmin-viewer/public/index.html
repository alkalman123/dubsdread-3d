<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Alpine Log — Garmin Mountain Viewer</title>
<meta name="description" content="Your Garmin data, seen like a bike/run/climb athlete." />
<meta name="theme-color" content="#0f1217" />
<script>
  // Applies a saved System/Light/Dark override before the stylesheet even
  // loads, so an explicit choice that disagrees with the OS setting (e.g.
  // "Light" while the phone is in dark mode) never flashes the wrong theme
  // for a frame. The full logic (persisting a change, keeping <meta
  // theme-color> in sync) lives in app.js's applyTheme() -- this is just
  // its first, synchronous run.
  try {
    var t = localStorage.getItem('alpineLogTheme');
    if (t && t !== 'system') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Alpine Log" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1><span class="ic" data-icon="mountain" data-icon-size="22"></span> Alpine Log <span id="modePill" class="mode-pill demo">demo</span></h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"><span class="ic" data-icon="settings" data-icon-size="19"></span></button>
  </header>

  <main id="main">
    <section id="view-today" class="view active"></section>
    <section id="view-activities" class="view"></section>
    <section id="view-trends" class="view"></section>
    <section id="view-sleep" class="view"></section>
    <section id="view-body" class="view"></section>
    <section id="view-plan" class="view"></section>
  </main>

  <nav class="tabbar">
    <div class="inner">
      <button data-tab="today" class="active"><span class="ic" data-icon="home"></span>Today</button>
      <button data-tab="activities"><span class="ic" data-icon="list"></span>Activities</button>
      <button data-tab="trends"><span class="ic" data-icon="trending-up"></span>Trends</button>
      <button data-tab="sleep"><span class="ic" data-icon="moon"></span>Sleep</button>
      <button data-tab="body"><span class="ic" data-icon="dna"></span>Body</button>
      <button data-tab="plan"><span class="ic" data-icon="target"></span>Plan</button>
    </div>
  </nav>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="activitySheet"></div>
<div class="sheet" id="settingsSheet"></div>
<div class="toast" id="toast"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/chartjs/chart.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
